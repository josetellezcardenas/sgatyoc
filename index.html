<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C81">
<title>SGATyOC · Asistencia</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'SF Mono',Consolas,'Roboto Mono',Menlo,monospace;--r-lg:16px;--r-md:12px;--r-sm:9px;--nav-h:66px;--ease:cubic-bezier(.22,.9,.3,1)}
html[data-theme="light"]{--bg:#EDF1F6;--surface:#FFF;--surface2:#F4F7FA;--border:#D6DFE9;--text:#16222F;--dim:#59697B;--primary:#0F4C81;--onpri:#FFF;--prisoft:#E1EBF5;--accent:#1173B1;--ok:#178A4C;--onok:#FFF;--oksoft:#E1F3E9;--warn:#B45309;--onwarn:#FFF;--warnsoft:#FBEEDC;--danger:#BE3A3A;--ondanger:#FFF;--dangersoft:#FBE7E5;--info:#0F62A8;--oninfo:#FFF;--infosoft:#E2EDF8;--shadow-sm:0 2px 10px rgba(15,76,129,.08);--grid-line:rgba(15,76,129,.05)}
html[data-theme="dark"]{--bg:#121212;--surface:#1B1D23;--surface2:#22252C;--border:#2E323A;--text:#EAEDF2;--dim:#9BA7B4;--primary:#54A9FF;--onpri:#071523;--prisoft:#16324C;--accent:#54A9FF;--ok:#3ECF7D;--onok:#052013;--oksoft:#10331F;--warn:#F5A524;--onwarn:#221302;--warnsoft:#3A2A10;--danger:#FF6B5E;--ondanger:#2B0705;--dangersoft:#3D1512;--info:#5AB2FF;--oninfo:#07182B;--infosoft:#122B45;--shadow-sm:0 2px 10px rgba(0,0,0,.4);--grid-line:rgba(255,255,255,.035)}
html[data-theme="ocean"]{--bg:#07222E;--surface:#0C2F3E;--surface2:#113A4C;--border:#1E4A5E;--text:#E7F4F4;--dim:#93B8C4;--primary:#2EC4B6;--onpri:#032A2B;--prisoft:#0E454A;--accent:#2EC4B6;--ok:#38D08B;--onok:#04231A;--oksoft:#0E3A2C;--warn:#FFC24D;--onwarn:#241703;--warnsoft:#403010;--danger:#FF7A6B;--ondanger:#2B0906;--dangersoft:#451B15;--info:#4CC3FF;--oninfo:#04202E;--infosoft:#0E3548;--shadow-sm:0 2px 10px rgba(0,0,0,.35);--grid-line:rgba(46,196,182,.06)}
html[data-theme="forest"]{--bg:#EFF3EA;--surface:#FFF;--surface2:#F6F8F1;--border:#D8E0CB;--text:#22301F;--dim:#5D6B4E;--primary:#386641;--onpri:#FFF;--prisoft:#E4EFE3;--accent:#A98467;--ok:#3D9257;--onok:#FFF;--oksoft:#E3F2E4;--warn:#B26205;--onwarn:#FFF;--warnsoft:#F7EBD9;--danger:#B94A3E;--ondanger:#FFF;--dangersoft:#F8E6E1;--info:#46708C;--oninfo:#FFF;--infosoft:#E4EEF2;--shadow-sm:0 2px 10px rgba(56,102,65,.09);--grid-line:rgba(56,102,65,.055)}
html[data-theme="sunset"]{--bg:#FBF0E7;--surface:#FFFDFA;--surface2:#FAF0E6;--border:#EFD9C6;--text:#372317;--dim:#8A6550;--primary:#D1495B;--onpri:#FFF;--prisoft:#FBE3E4;--accent:#F2994A;--ok:#3E9253;--onok:#FFF;--oksoft:#E5F3E5;--warn:#C97408;--onwarn:#FFF;--warnsoft:#FBEBD5;--danger:#C0392B;--ondanger:#FFF;--dangersoft:#F9E3DF;--info:#9C4D77;--oninfo:#FFF;--infosoft:#F4E3EC;--shadow-sm:0 2px 10px rgba(209,73,91,.09);--grid-line:rgba(209,73,91,.05)}
html[data-theme="sakura"]{--bg:#FAF4F6;--surface:#FFF;--surface2:#FBF3F5;--border:#EEDCE2;--text:#3B2B33;--dim:#8A707B;--primary:#A85D75;--onpri:#FFF;--prisoft:#F6E6EB;--accent:#E5989B;--ok:#4C9A62;--onok:#FFF;--oksoft:#E6F3E9;--warn:#B5822E;--onwarn:#FFF;--warnsoft:#F8EFDC;--danger:#C25460;--ondanger:#FFF;--dangersoft:#F9E6E8;--info:#6C7FBF;--oninfo:#FFF;--infosoft:#E9EDF9;--shadow-sm:0 2px 10px rgba(168,93,117,.09);--grid-line:rgba(168,93,117,.05)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(#000 0%,transparent 78%);-webkit-mask-image:linear-gradient(#000 0%,transparent 78%)}
.shell{position:relative;z-index:1;display:flex;min-height:100dvh}
.sidebar{width:248px;flex-shrink:0;position:sticky;top:0;height:100dvh;display:none;flex-direction:column;padding:22px 16px;background:var(--surface);border-right:1px solid var(--border)}
.sb-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;border-bottom:1px solid var(--border)}
.brand-mark{width:42px;height:42px;flex-shrink:0;color:var(--primary)}
.sb-brand b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.sb-brand small{font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.sb-nav{display:flex;flex-direction:column;gap:4px;margin-top:18px;flex:1}
.sb-nav .navbtn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--dim);font-weight:600;font-size:14px;transition:all .25s var(--ease);text-align:left;width:100%}
.sb-nav .navbtn svg{width:20px;height:20px;flex-shrink:0}
.sb-nav .navbtn.on{background:var(--prisoft);color:var(--primary)}
.sb-user{border-top:1px solid var(--border);padding-top:14px;display:flex;gap:10px;align-items:center}
.sb-themes{display:flex;gap:6px;padding:12px 8px 0}
.sb-themes button{width:18px;height:18px;border-radius:50%;border:2px solid var(--border)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
.tb-title{min-width:0;flex:1}
.tb-title h1{font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-clock{font-weight:800;font-size:15px}
.tb-clock small{display:block;font-size:10px;color:var(--dim);font-weight:600;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.chip.warn{background:var(--warnsoft);color:var(--warn)}
.chip.danger{background:var(--dangersoft);color:var(--danger)}
.chip.info{background:var(--infosoft);color:var(--info)}
.chip.soft{background:var(--surface2);color:var(--dim);border-color:var(--border)}
.chip .bdot{min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:var(--onwarn);font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;padding:0 4px}
.off-banner{display:none;align-items:center;gap:10px;padding:10px 18px;font-size:13px;font-weight:600;background:var(--warnsoft);color:var(--warn);border-bottom:1px solid var(--border)}
.off-banner.show{display:flex}
.off-banner svg{width:17px;height:17px;flex-shrink:0}
.content{flex:1;padding:20px 18px calc(var(--nav-h) + 34px)}
.view{display:none}
.view.active{display:block;animation:viewIn .4s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{max-width:1140px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:16px;height:16px;color:var(--primary)}
.card-b{padding:18px}
.micro{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.clock-card{padding:22px 20px 18px;text-align:center;position:relative;overflow:hidden}
.clock-card::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.greet{font-size:13px;color:var(--dim);font-weight:600}
.big-clock{font-size:clamp(40px,9vw,54px);font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.big-date{font-size:13px;color:var(--dim);font-weight:600;text-transform:capitalize}
.steps{display:flex;justify-content:center;margin-top:16px;flex-wrap:wrap}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;flex:1;min-width:70px}
.step:not(:last-child)::after{content:"";position:absolute;top:12px;left:calc(50% + 16px);width:calc(100% - 32px);height:2px;background:var(--border);border-radius:2px}
.step.done:not(:last-child)::after{background:var(--ok)}
.step .pt{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;background:var(--surface);z-index:1}
.step .pt svg{width:12px;height:12px;opacity:0}
.step.done .pt{background:var(--ok);border-color:var(--ok);color:var(--onok)}
.step.done .pt svg{opacity:1}
.step.now .pt{border-color:var(--primary);box-shadow:0 0 0 4px var(--prisoft)}
.step small{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase}
.step.done small{color:var(--ok)}
.step.now small{color:var(--primary)}
.reader-zone{position:relative;height:300px;background:#0C0F14;border-radius:var(--r-md);overflow:hidden;display:grid;place-items:center}
#qrVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1;background:#000}
.qr-ghost{position:absolute;inset:0;display:grid;place-items:center;opacity:.28;z-index:0}
.qr-ghost svg{width:170px;height:170px}
.reader-zone.camera-on .qr-ghost{display:none}
.scan-frame{position:relative;width:250px;height:250px;max-width:80%;max-height:80%;box-shadow:0 0 0 999px rgba(5,8,12,.62);border-radius:6px;z-index:3}
.scan-frame .corner{position:absolute;width:30px;height:30px;border:3.5px solid var(--accent)}
.scan-frame .c1{top:-2px;left:-2px;border-right:none;border-bottom:none}
.scan-frame .c2{top:-2px;right:-2px;border-left:none;border-bottom:none}
.scan-frame .c3{bottom:-2px;left:-2px;border-right:none;border-top:none}
.scan-frame .c4{bottom:-2px;right:-2px;border-left:none;border-top:none}
.scan-line{position:absolute;left:8%;right:8%;top:10%;height:2.5px;border-radius:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);opacity:0;z-index:4}
.reader-zone.scanning .scan-line{opacity:1;animation:scanMove 1.7s ease-in-out infinite}
@keyframes scanMove{0%,100%{top:8%}50%{top:90%}}
.reader-zone.ok-flash{animation:okFlash .6s}
@keyframes okFlash{30%{box-shadow:inset 0 0 0 6px var(--ok)}}
.scan-status{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#DDE6F0;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7);z-index:4;padding:0 14px}
.torch-btn{position:absolute;top:12px;right:12px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(20,25,32,.72);color:#EAF2FA;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18)}
.torch-btn svg{width:18px;height:18px}
.torch-btn.on{background:var(--warn);color:var(--onwarn)}
.scan-controls{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.token-chip{display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:99px;background:var(--oksoft);color:var(--ok);font-weight:700;font-size:13px}
.token-chip.show{display:inline-flex}
.token-chip.expired{background:var(--dangersoft);color:var(--danger)}
.token-chip .tring{width:20px;height:20px;transform:rotate(-90deg)}
.token-chip .tring circle{fill:none;stroke:currentColor;stroke-width:2.6;stroke-dasharray:50.27;stroke-linecap:round}
.token-chip code{font-family:var(--mono);letter-spacing:.14em;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);font-weight:700;font-size:13.5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .2s var(--ease)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--onpri)}
.btn.primary:hover{opacity:.92;color:var(--onpri)}
.btn svg{width:16px;height:16px}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.big{width:100%;justify-content:center;padding:16px;font-size:16px;border-radius:12px}
.btn.big.locked{opacity:.55}
.btn.big.st-ok{background:var(--ok);border-color:var(--ok);color:var(--onok)}
.btn.big.st-warn{background:var(--warn);border-color:var(--warn);color:var(--onwarn)}
.btn.big.st-info{background:var(--info);border-color:var(--info);color:var(--oninfo)}
.btn.big.st-danger{background:var(--danger);border-color:var(--danger);color:var(--ondanger)}
.geo-row{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.geo-row svg{width:17px;height:17px;flex-shrink:0;color:var(--dim)}
.geo-row .spin{animation:rot 1.1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.geofence-viz{width:120px;height:120px;border-radius:50%;position:relative;background:var(--surface2);border:1px solid var(--border);flex-shrink:0;margin-left:auto}
.geofence-viz .ring30{position:absolute;inset:22px;border-radius:50%;border:1.5px dashed var(--ok);opacity:.75}
.geofence-viz.out .ring30{border-color:var(--warn)}
.geofence-viz .office{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--prisoft)}
.geofence-viz .userdot{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:var(--ok);transition:transform 1s var(--ease),background .4s}
.geofence-viz.out .userdot{background:var(--warn)}
.today-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--border)}
.today-item:last-child{border-bottom:none}
.ti-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.ti-ico svg{width:17px;height:17px}
.today-item .tt{flex:1;min-width:0;text-align:left}
.today-item .tt b{font-size:13.5px;display:block}
.today-item .tt small{font-size:11.5px;color:var(--dim)}
.today-item .tm{font-family:var(--mono);font-weight:700;font-size:14.5px}
.empty{padding:26px;text-align:center;color:var(--dim);font-size:13px}
.ruta-intro{font-size:13.5px;color:var(--dim);line-height:1.55;margin-bottom:14px}
.gps-opt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border:1px dashed var(--border);border-radius:var(--r-sm);margin-bottom:10px}
.gps-opt b{font-size:13.5px;display:block}
.gps-opt small{font-size:11.5px;color:var(--dim);display:block;margin-top:1px}
.gps-state{font-size:12px;font-weight:700;margin:0 0 12px;color:var(--dim)}
.chat-box{max-height:300px;min-height:120px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.msg{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4}
.msg.coord{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--onpri)}
.msg small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.chat-input{display:flex;gap:8px;padding:12px 16px}
.chat-input input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;outline:none;color:var(--text)}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .mn-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center}
.month-nav .mn-btn:disabled{opacity:.35;cursor:not-allowed}
.month-nav .mn-btn svg{width:16px;height:16px}
.month-label{font-size:17px;font-weight:800;min-width:170px;text-align:center;text-transform:capitalize}
.sum-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.sum-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 15px}
.sum-item b{font-size:21px;font-weight:800;display:block}
.sum-item span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.hrow{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr .85fr;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13.5px}
.hrow.head{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);background:var(--surface2);padding:10px 16px}
.hcell{display:flex;align-items:center;gap:3px;min-width:0}
.hcell b{font-family:var(--mono);font-weight:700}
.hcell .dash{color:var(--dim);opacity:.6}
.hdate b{font-weight:700;font-size:13.5px;display:block}
.hdate small{font-size:11px;color:var(--dim);text-transform:capitalize}
.ot-pos{color:var(--ok);font-weight:800;font-family:var(--mono)}
.ast{color:var(--primary);font-weight:800;font-size:15px;padding:1px 5px;border-radius:5px;position:relative;top:-3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;font-size:12px;color:var(--dim);align-items:center}
.legend .ast{top:0;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--primary))}
.kpi b{font-size:26px;font-weight:800;display:block;line-height:1.1}
.kpi span{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--border);align-items:center}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:0 12px;flex:1;min-width:180px}
.search-box svg{width:15px;height:15px;color:var(--dim);flex-shrink:0}
.search-box input{border:none;background:none;padding:9px 0;width:100%;font-size:13.5px;outline:none;color:var(--text)}
.table-scroll{overflow-x:auto}
.adm-table{width:100%;border-collapse:collapse;min-width:720px}
.adm-table th{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);text-align:left;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--border)}
.adm-table td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
.adm-table tbody tr:hover{background:var(--surface2)}
.emp-cell{display:flex;align-items:center;gap:10px;min-width:180px}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--prisoft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex-shrink:0}
